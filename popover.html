<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Заметки</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #16162a;
      color: #cccce8;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px 9px 14px;
      background: #111120;
      border-bottom: 1px solid #252538;
      flex-shrink: 0;
    }

    #token-name {
      flex: 1;
      font-size: 12px;
      font-weight: 600;
      color: #7070a0;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #close-btn {
      background: none;
      border: none;
      color: #404060;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      padding: 3px 5px;
      border-radius: 4px;
      transition: color 0.15s, background 0.15s;
      flex-shrink: 0;
    }
    #close-btn:hover { color: #c0c0e0; background: #22223a; }

    /* ── Textarea ── */
    #notes {
      flex: 1;
      background: #16162a;
      border: none;
      color: #cccce8;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.7;
      padding: 14px;
      resize: none;
      outline: none;
    }

    /* ── Footer ── */
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px 7px 14px;
      background: #111120;
      border-top: 1px solid #252538;
      flex-shrink: 0;
      position: relative;
    }

    #status {
      font-size: 11px;
      color: #383858;
      transition: color 0.25s;
      min-width: 90px;
    }
    #status.saving { color: #b09020; }
    #status.saved  { color: #30a060; }
    #status.error  { color: #a03030; }

    #save-btn {
      background: #222240;
      border: 1px solid #333360;
      border-radius: 5px;
      color: #8888c0;
      cursor: pointer;
      font-size: 12px;
      padding: 4px 14px;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    #save-btn:hover {
      background: #303060;
      border-color: #4040a0;
      color: #c0c0f0;
    }

    /* ── Resize handle ── */
    #resize-handle {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 18px;
      height: 18px;
      cursor: nwse-resize;
      opacity: 0.25;
      transition: opacity 0.2s;
    }
    #resize-handle:hover { opacity: 0.7; }

    /* diagonal lines */
    #resize-handle::before,
    #resize-handle::after {
      content: "";
      position: absolute;
      right: 3px;
      background: #a0a0c8;
      border-radius: 1px;
    }
    #resize-handle::before {
      bottom: 7px; width: 10px; height: 1.5px;
      transform: rotate(45deg);
    }
    #resize-handle::after {
      bottom: 4px; width: 6px; height: 1.5px;
      transform: rotate(45deg);
    }
  </style>
  <script type="module" crossorigin src="/assets/popover-DqWxJpGx.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/lib-DGRDy4UO.js">
</head>
<body>
  <header>
    <div id="token-name">Заметки</div>
    <button id="close-btn" title="Закрыть">✕</button>
  </header>

  <textarea id="notes"></textarea>

  <footer>
    <span id="status"></span>
    <button id="save-btn">Сохранить</button>
    <div id="resize-handle"></div>
  </footer>

</body>
</html>
