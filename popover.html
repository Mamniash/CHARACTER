<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заметки</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a2a;
      color: #d0d0e8;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 10px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    #token-name {
      font-size: 13px;
      font-weight: 600;
      color: #8080a8;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
    }

    #status {
      font-size: 11px;
      color: #404060;
      flex-shrink: 0;
      transition: color 0.3s;
    }

    #status.saving {
      color: #c0a020;
    }

    #status.saved {
      color: #40a060;
    }

    #notes {
      flex: 1;
      background: #11111e;
      border: 1px solid #2a2a40;
      border-radius: 8px;
      color: #d0d0e8;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.65;
      padding: 12px;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }

    #notes:focus {
      border-color: #3a3a60;
    }

    #notes::placeholder {
      color: #303050;
    }
  </style>
  <script type="module" crossorigin src="/assets/popover-BLukTrW-.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/lib-DGRDy4UO.js">
</head>
<body>
  <header>
    <div id="token-name">Заметки</div>
    <span id="status"></span>
  </header>
  <textarea
    id="notes"
    placeholder="Золото, предметы, эффекты...

Пиши что угодно."
  ></textarea>

</body>
</html>
